name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      # Cancel all remaining builds as soon as one fails; the release job
      # only runs if every matrix build succeeds.
      fail-fast: true
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/catt${ext}" .
          echo "BINARY=catt${ext}" >> "$GITHUB_ENV"

      - name: Package (tar.gz)
        if: matrix.os != 'windows'
        run: |
          tar -czf "dist/catt-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C dist "$BINARY"
          sha256sum "dist/catt-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" > "dist/catt-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256"

      - name: Package (zip)
        if: matrix.os == 'windows'
        run: |
          (cd dist && zip -q "catt-${{ matrix.os }}-${{ matrix.arch }}.zip" "$BINARY")
          sha256sum "dist/catt-${{ matrix.os }}-${{ matrix.arch }}.zip" > "dist/catt-${{ matrix.os }}-${{ matrix.arch }}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catt-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/catt-*
          retention-days: 1

  release:
    name: Create GitHub release
    needs: build
    # Explicit guard: skip the release if any build failed or was cancelled.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*